<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>New Tab</title>
	<link rel=" shortcut icon" type="image/png" href="assets/img/81800.png" />
	<link rel="stylesheet" href="app.css" />
	<script src="https://unpkg.com/lucide@0.330.0"></script>
</head>

<!--

<body class="">
	<!-- <button id="themeButton">
			<i id="themeIcon" icon-name="moon"></i>
		</button> -->
	<div class="container">

		<!-- Search Bar -->
		<div class="search-container">
			<form action="https://www.google.com/search" method="GET" target="" class="search-form">
				<input type="text" name="q" placeholder="Search Google..." class="search-input" autocomplete="off">
				<button type="submit" class="search-button">
					<i data-lucide="search"></i>
				</button>
			</form>
		</div>

		<!-- Mini Music Player (Top Left below Search Bar) -->
		<div class="miniMusicBlock" id="miniMusicBlock">
			<div class="vinyl-disk-wrapper">
				<div class="spinning-disk" id="spinningDisk">
					<div class="vinyl-groove groove-1"></div>
					<div class="vinyl-groove groove-2"></div>
					<div class="vinyl-groove groove-3"></div>
					<div class="vinyl-center-hole"></div>
				</div>
			</div>
			<div class="tag-wrapper">
				<div class="tag-track-info">
					<span id="trackTitle" class="mini-track-title">Cyberpunk Synthwave</span>
					<span class="track-separator">•</span>
					<span id="trackArtist" class="mini-track-artist">Yue Beats</span>
				</div>
				<div class="music-tag-banner">
					<div class="mini-music-controls">
						<button class="mini-btn" id="prevTrackBtn" aria-label="Previous Track"><i data-lucide="skip-back"></i></button>
						<button class="mini-btn play-btn" id="playPauseBtn" aria-label="Play/Pause"><i data-lucide="play" id="playIcon"></i></button>
						<button class="mini-btn" id="nextTrackBtn" aria-label="Next Track"><i data-lucide="skip-forward"></i></button>
					</div>
				</div>
			</div>
		</div>

		<!-- Weather Block (Right side of Music Block, offset down) -->
		<div class="weatherBlock" id="weatherBlock">
			<div class="weather">
				<div class="weatherIcon">
					<img src="assets/icons/OneDark/02d.png" alt="Weather" />
				</div>
				<div class="weatherInfo">
					<div class="weatherValue">
						<p>24°<span class="tempUnit">C</span></p>
					</div>
					<div class="weatherDescription">
						<p>Few Clouds</p>
					</div>
				</div>
			</div>
		</div>

		<!-- Clock and Greetings  -->
		<div class="timeBlock">
			<div class="time-header">
				<div class="clock">
					<span id="hour"></span><span id="separator">:</span><span id="minutes"></span>
				</div>
				<div id="greetings"></div>
			</div>
			<div class="date-pill">
				<span id="full-date" class="date-text"></span>
				<button id="datePillBtn" class="date-pill-icon-btn" aria-label="Action">
					<i data-lucide="square-up-right"></i>
				</button>
			</div>
		</div>

		<!-- Links Block -->
		<div class="linksBlock" id="linksBlock">
			<div class="linksBlockLeft" id="linksBlockLeft"></div>
			<!-- <div class="linksBlockRight" id="linksBlockRight"></div> -->
		</div>

		<!-- Image Carousel Block -->
		<div class="imageBlock" id="imageBlock">
			<img src="assets/floating-img/Ghej89jacAIPBZw.png" alt="Artwork 1" class="side-img">
			<img src="assets/floating-img/GhdtMl9bgAAJI0g.jfif" alt="Artwork 2" class="side-img">
		</div>

	</div>


	<!-- Config  -->
	<script src="config.js"></script>

	<!-- Scripts  -->
	<script src="assets/js/layout.js"></script>
	<!-- <script src="assets/js/theme.js"></script> -->
	<script src="assets/js/time.js"></script>
	<script src="assets/js/greeting.js"></script>
	<script src="assets/js/weather.js"></script>

	<!-- Generators  -->
	<script src="assets/js/buttons.js"></script>
	<!-- <script src="assets/js/lists.js"></script> -->
	<script src="assets/js/musicPlayer.js"></script>
	<script src="assets/js/imageCarousel.js"></script>

	<!-- Icons -->
	<script>
		lucide.createIcons();
	</script>
</body>

</html>
